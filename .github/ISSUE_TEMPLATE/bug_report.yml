name: Bug report
description: Report a parser, cleaning, export, or interface problem using synthetic data.
body:
  - type: markdown
    attributes:
      value: Please do not attach real transcripts, credentials, private images, or personal data. Security-sensitive reports should follow SECURITY.md.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: ThreadPack version, browser or Node version, and operating system.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source format
      description: Source tool/version and file type, for example Claude Code JSONL.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and synthetic input
      description: The smallest fake input and actions that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
