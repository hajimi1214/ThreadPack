name: Bug report
description: Report a reproducible parsing, cleanup, export, or interface issue.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Provide a small synthetic example. Do not attach private conversations, real credentials, or unredacted screenshots."
  - type: input
    id: version
    attributes:
      label: ThreadPack version
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser or Node.js version, OS, and web or CLI usage.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the source export format and selected cleanup settings.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal synthetic input
      description: Replace all real content and secrets with invented values.
      render: text
