<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">ThreadPack</title>
  <desc id="desc">Offline AI conversation processing toolkit. Import, clean, redact, and export.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#3d64a5"/></pattern>
    <linearGradient id="fade"><stop stop-color="#071c50"/><stop offset="1" stop-color="#103f9c"/></linearGradient>
  </defs>
  <rect width="1280" height="360" rx="16" fill="url(#fade)"/>
  <rect x="780" y="0" width="500" height="360" fill="url(#grid)" opacity=".6"/>
  <image href="../../icons/icon-512.png" x="76" y="67" width="46" height="48" preserveAspectRatio="xMidYMid meet"/>
  <text x="137" y="102" fill="#f3f7ff" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="650" letter-spacing="-1">ThreadPack</text>
  <text x="76" y="176" fill="#e6efff" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="400" letter-spacing="-.7">Offline AI conversation processing toolkit.</text>
  <text x="77" y="214" fill="#a2bde9" font-family="Segoe UI,Arial,sans-serif" font-size="16">Import, clean, redact, and export context for your next conversation.</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#c6d9fc">
    <rect x="77" y="256" width="86" height="29" rx="5" fill="#183f88" stroke="#5278b6"/><text x="95" y="275">Local first</text>
    <rect x="173" y="256" width="85" height="29" rx="5" fill="#183f88" stroke="#5278b6"/><text x="190" y="275">No API key</text>
    <rect x="268" y="256" width="93" height="29" rx="5" fill="#183f88" stroke="#5278b6"/><text x="285" y="275">Web + CLI</text>
  </g>
  <g transform="translate(1000 85) rotate(7)">
    <rect x="-25" y="-12" width="143" height="188" rx="8" fill="#2a5198" stroke="#8cace3" transform="rotate(-14)"/>
    <rect width="145" height="190" rx="8" fill="#ecf3ff" stroke="#ffffff"/>
    <path d="M23 34h91 M23 49h61" stroke="#afc7ed" stroke-width="5" stroke-linecap="round"/>
    <path d="m23 78 5 5 9-10 m-14 30 5 5 9-10 m-14 30 5 5 9-10" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M49 78h60 M49 103h47 M49 128h56" stroke="#a9c5f2" stroke-width="4" stroke-linecap="round"/>
    <path d="M23 158h91" stroke="#c8d8f2" stroke-width="1"/>
    <text x="23" y="175" fill="#3963a5" font-family="Segoe UI,Arial,sans-serif" font-size="8">READY FOR THE NEXT CHAT</text>
  </g>
</svg>
